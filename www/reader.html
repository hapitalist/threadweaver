<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>Reader</title>
<style>
:root{--bg:#0f0c16;--ink:#ece3d0;--gold:#e8b53a;--dim:#9b91ac;--edge:#2e2742}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:Georgia,serif;overflow:hidden}
#bar{position:fixed;top:0;left:0;right:0;height:calc(46px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:#0e0b16;border-bottom:1px solid var(--edge);z-index:10}
#bar .ttl{font-family:Georgia,serif;font-size:14px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
#bar .ctl{display:flex;gap:6px}
#bar button{font-family:monospace;font-size:13px;background:#1d1830;border:1px solid var(--edge);color:var(--ink);
  width:34px;height:30px;border-radius:8px;cursor:pointer}
#bar button:active{border-color:var(--gold);color:var(--gold)}
#area{position:absolute;top:calc(46px + env(safe-area-inset-top));bottom:42px;left:50%;transform:translateX(-50%);width:100%;max-width:42rem;padding:0 24px;box-sizing:border-box}
#viewer{height:100%;width:100%}
#nav{position:fixed;bottom:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;background:#0e0b16;border-top:1px solid var(--edge);z-index:10;font-family:monospace;font-size:12px;color:var(--dim)}
#nav .arrow{font-size:20px;color:var(--gold);cursor:pointer;padding:0 18px;user-select:none}
#pct{letter-spacing:1px}
/* tap zones for page turn */
.zone{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:42px;width:28%;z-index:5}
#zL{left:0}#zR{right:0}
#zC{left:28%;right:28%;width:auto}
/* hide chrome (immersive reading) */
body.chrome-off #bar,body.chrome-off #nav{transform:translateY(0);opacity:0;pointer-events:none}
body.chrome-off #bar{transform:translateY(-100%)}
body.chrome-off #nav{transform:translateY(100%)}
#bar,#nav{transition:transform .2s ease,opacity .2s ease}
/* chapter label in the footer */
#chap{font-family:monospace;font-size:11px;color:var(--dim);max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* TOC drawer */
#toc{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:42px;left:0;width:80%;max-width:340px;background:#0e0b16;border-right:1px solid var(--edge);z-index:30;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding:10px 0}
#toc.on{transform:translateX(0)}
#search{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:42px;left:0;width:88%;max-width:380px;background:#0e0b16;border-right:1px solid var(--edge);z-index:31;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding:10px 0}
#search.on{transform:translateX(0)}
#search .toc-head{font-family:monospace;font-size:11px;letter-spacing:2px;color:var(--gold);padding:8px 18px 12px;border-bottom:1px solid var(--edge)}
#searchbox{display:flex;gap:8px;padding:12px 16px}
#searchInput{flex:1;background:#161122;border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:15px;font-family:inherit}
#searchGo{background:#1d1830;border:1px solid var(--edge);color:var(--ink);border-radius:8px;padding:0 16px;cursor:pointer;font-family:monospace;font-size:13px}
#searchStatus{font-family:monospace;font-size:11px;color:var(--dim);padding:2px 18px 8px}
#searchResults a{display:block;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.45;border-bottom:1px solid rgba(255,255,255,.04)}
#searchResults a b{color:var(--gold);font-weight:700}
#searchResults a .rchap{display:block;font-family:monospace;font-size:10px;color:var(--dim);margin-top:3px}
#toc .toc-head{font-family:monospace;font-size:11px;letter-spacing:2px;color:var(--gold);padding:8px 18px 12px;border-bottom:1px solid var(--edge)}
#toc a{display:block;padding:11px 18px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.3;border-bottom:1px solid rgba(255,255,255,.04)}
#toc a:active{background:#1d1830;color:var(--gold)}
#notebook{position:fixed;top:calc(46px + env(safe-area-inset-top));bottom:42px;left:0;width:88%;max-width:380px;background:#0e0b16;border-right:1px solid var(--edge);z-index:31;transform:translateX(-105%);transition:transform .22s ease;overflow-y:auto;padding:10px 0}
#notebook.on{transform:translateX(0)}
#notebook .toc-head{font-family:monospace;font-size:11px;letter-spacing:2px;color:var(--gold);padding:8px 18px 12px;border-bottom:1px solid var(--edge)}
#nbFilters{display:flex;gap:8px;padding:10px 18px;border-bottom:1px solid var(--edge)}
.nbchip{background:transparent;border:1px solid var(--edge);color:var(--dim);font-family:monospace;font-size:11px;padding:5px 12px;border-radius:14px;cursor:pointer}
.nbchip.on{border-color:var(--gold);color:var(--gold)}
#nbStatus{font-family:monospace;font-size:11px;color:var(--dim);padding:10px 18px 4px}
.nbrow{display:flex;align-items:flex-start;gap:10px;padding:11px 14px 11px 18px;border-bottom:1px solid rgba(255,255,255,.04)}
.nbrow .nbmain{flex:1;min-width:0;cursor:pointer}
.nbrow .nbmain .nbtxt{display:block;color:var(--ink);font-size:13px;line-height:1.45;text-decoration:none}
.nbrow .nbmain .nbmeta{display:block;font-family:monospace;font-size:10px;color:var(--dim);margin-top:4px}
.nbrow .nbkind{flex:0 0 auto;font-size:13px;color:var(--gold);line-height:1.45}
.nbrow .nbdot{flex:0 0 auto;width:13px;height:13px;border-radius:50%;margin-top:4px;border:1px solid rgba(255,255,255,.25)}
.nbrow .nbnote{display:block;color:var(--gold);font-size:12px;line-height:1.4;margin-top:5px;font-style:italic;border-left:2px solid var(--gold);padding-left:8px}
.nbrow .nbshare{flex:0 0 auto;background:transparent;border:none;color:var(--dim);font-size:16px;line-height:1;padding:0 4px;cursor:pointer}
.nbrow .nbshare:active{color:var(--gold)}
.nbrow .nbdel{flex:0 0 auto;background:transparent;border:none;color:var(--dim);font-size:18px;line-height:1;padding:0 4px;cursor:pointer}
.nbrow .nbdel:active{color:#e06363}
#nbList .nbempty{font-family:monospace;font-size:12px;color:var(--dim);padding:20px 18px;line-height:1.6}
#selpop{position:fixed;z-index:40;display:none;background:#0e0b16;border:1px solid var(--gold);border-radius:10px;padding:6px;box-shadow:0 6px 22px rgba(0,0,0,.55);align-items:center;gap:6px}
#selpop.on{display:flex}
#selpop .sp-colors{display:flex;gap:5px}
#selpop .sp-sw{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
#selpop .sp-sw:active{transform:scale(.9)}
/* dictionary definition card */
#defcard{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:560px;background:#fff;color:#1a1422;border-radius:16px 16px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.4);padding:20px 20px 26px;z-index:140;display:none}
#defcard.on{display:block}
#defcard.dark{background:#181226;color:#e9e2f5}
#defcard .defx{position:absolute;right:12px;top:12px;background:none;border:none;font-size:24px;color:#9890a8;cursor:pointer;line-height:1}
#defcard .defw{font-family:'Cinzel',serif;font-size:23px;font-weight:600;margin-bottom:12px;text-transform:capitalize}
#defcard .defsec{margin-bottom:14px}
#defcard .deflbl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:#a87f2a;margin-bottom:4px}
#defcard.dark .deflbl{color:#e8b53a}
#defcard .defbody{font-size:16px;line-height:1.5}
#defcard .defcat{font-family:'DM Mono',monospace;font-size:11px;color:#9890a8;margin-top:4px;text-transform:capitalize}
#defcard .defnone{font-size:15px;color:#9890a8;font-style:italic}
#selpop .sp-act{background:transparent;border:none;color:var(--ink);font-family:monospace;font-size:12px;padding:6px 10px;cursor:pointer;border-radius:6px;border-left:1px solid var(--edge)}
#selpop .sp-act:active{background:#1d1830;color:var(--gold)}
/* settings sheet */
#settings{position:fixed;left:0;right:0;bottom:42px;background:#0e0b16;border-top:1px solid var(--edge);z-index:30;transform:translateY(120%);transition:transform .22s ease;padding:8px 16px calc(10px + env(safe-area-inset-bottom))}
#settings.on{transform:translateY(0)}
#settings .set-row{display:flex;justify-content:space-between;align-items:center;padding:11px 2px;font-family:monospace;font-size:13px;color:var(--ink);border-bottom:1px solid rgba(255,255,255,.05)}
#settings .set-row:last-child{border-bottom:none}
#settings button{font-family:monospace;font-size:14px;background:#1d1830;border:1px solid var(--edge);color:var(--ink);width:40px;height:32px;border-radius:8px;cursor:pointer;margin-left:6px}
#settings button:active{border-color:var(--gold);color:var(--gold)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:monospace;color:var(--dim);font-size:13px;z-index:20}
body.sepia{--bg:#f4ecd8;--ink:#3a2f1e;--dim:#8a7a5a;--edge:#d8c9a8}
body.light{--bg:#ffffff;--ink:#1a1a1a;--dim:#888;--edge:#ddd}
body.black{--bg:#000000;--ink:#c8c2d0;--dim:#6a6478;--edge:#1a1726}
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/atkinson-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Atkinson Hyperlegible';src:url('fonts/atkinson-700.woff2') format('woff2');font-weight:700;font-display:swap}
/* reading light: a warm dimming overlay above the page, below the chrome */
#dimmer{position:fixed;inset:0;z-index:8;pointer-events:none;background:#000;opacity:0;transition:opacity .2s,background-color .2s}
</style>

<body>
<div id="bar">
  <span class="ttl" id="ttl">Loading…</span>
  <div class="ctl">
    <button onclick="toggleTOC()" title="Contents" aria-label="Table of contents">&#9776;</button>
    <button onclick="toggleSearch()" title="Search in book" aria-label="Search inside this book">&#128269;</button>
    <button onclick="toggleBookmark()" id="bmBtn" title="Bookmark this page" aria-label="Bookmark this page">&#9734;</button>
    <button onclick="toggleNotebook()" title="Notebook" aria-label="Bookmarks and highlights notebook">&#128278;</button>
    <button onclick="setFont(-1)" title="Smaller text" aria-label="Decrease text size">A&#8722;</button>
    <button onclick="setFont(1)" title="Bigger text" aria-label="Increase text size">A+</button>
    <button onclick="toggleSettings()" title="Display settings" aria-label="Display and accessibility settings">Aa</button>
    <button onclick="cycleTheme()" title="Theme" aria-label="Change color theme">&#9681;</button>
  </div>
</div>
<div id="area"><div id="viewer"></div></div>
<div id="zL" class="zone" onclick="prev()" aria-label="Previous page"></div>
<div id="zC" class="zone" onclick="toggleChrome()" aria-label="Toggle reading controls"></div>
<div id="zR" class="zone" onclick="next()" aria-label="Next page"></div>
<div id="nav">
  <span class="arrow" onclick="prev()" role="button" aria-label="Previous page">&#8249;</span>
  <span id="chap"></span>
  <span id="pct">&#8212;</span>
  <span class="arrow" onclick="next()" role="button" aria-label="Next page">&#8250;</span>
</div>
<div id="toc"><div class="toc-head">Contents</div><div id="toclist"></div></div>
<div id="search">
  <div class="toc-head">Search this book</div>
  <div id="searchbox">
    <input id="searchInput" type="search" placeholder="Find a word or phrase&#8230;" aria-label="Search text" autocomplete="off" autocapitalize="off">
    <button onclick="runSearch()" id="searchGo" aria-label="Run search">Go</button>
  </div>
  <div id="searchStatus" aria-live="polite"></div>
  <div id="searchResults"></div>
</div>
<div id="notebook">
  <div class="toc-head">Notebook</div>
  <div id="nbFilters">
    <button class="nbchip on" data-filt="all" onclick="nbFilter('all')">All</button>

    <button class="nbchip" data-filt="highlight" onclick="nbFilter('highlight')">Highlights</button>
  </div>
  <div id="nbStatus" aria-live="polite"></div>

</div>
<div id="settings" role="dialog" aria-label="Display and accessibility settings">
  <div class="set-row"><span>Font</span><span><button onclick="cycleFont()" id="fontBtn" aria-label="Change font">Serif</button></span></div>
  <div class="set-row"><span>Line spacing</span><span><button onclick="setLead(-1)" aria-label="Decrease line spacing">&#8722;</button><button onclick="setLead(1)" aria-label="Increase line spacing">+</button></span></div>
  <div class="set-row"><span>Margins</span><span><button onclick="setMargin(-1)" aria-label="Decrease margins">&#8722;</button><button onclick="setMargin(1)" aria-label="Increase margins">+</button></span></div>
  <div class="set-row"><span>Justify text</span><span><button onclick="toggleJustify()" id="justBtn" aria-label="Toggle justified text">On</button></span></div>
  <div class="set-row"><span>Reading light</span><span><button onclick="setDim(-1)" aria-label="Brighter">&#9788;</button><button onclick="setDim(1)" aria-label="Dimmer">&#9789;</button></span></div>
  <div class="set-row"><span>Warmth (night)</span><span><button onclick="setWarm(-1)" aria-label="Cooler">&#8722;</button><button onclick="setWarm(1)" aria-label="Warmer">+</button></span></div>
  <div class="set-row"><span>Page mode</span><span><button onclick="toggleFlow()" id="flowBtn" aria-label="Toggle scroll or page mode">Pages</button></span></div>
  <div class="set-row"><span>Reduce motion</span><span><button onclick="toggleMotion()" id="motionBtn" aria-label="Toggle reduce motion">Off</button></span></div>
</div>
<div id="dimmer" aria-hidden="true"></div>
<div id="loading">Opening book&#8230;</div>
<div id="selpop">
  <div class="sp-colors">
    <button class="sp-sw" data-color="#e8b53a" style="background:#e8b53a" onclick="hlFromSelection('#e8b53a')" aria-label="Gold highlight"></button>
    <button class="sp-sw" data-color="#7ec96b" style="background:#7ec96b" onclick="hlFromSelection('#7ec96b')" aria-label="Green highlight"></button>
    <button class="sp-sw" data-color="#6bb6e8" style="background:#6bb6e8" onclick="hlFromSelection('#6bb6e8')" aria-label="Blue highlight"></button>
    <button class="sp-sw" data-color="#e87fb0" style="background:#e87fb0" onclick="hlFromSelection('#e87fb0')" aria-label="Pink highlight"></button>
  </div>
  <button class="sp-act" onclick="noteFromSelection()">Note</button>
  <button class="sp-act" onclick="defineFromSelection()">Define</button>
</div>
<div id="defcard">

  </div>
  <div class="defsec" id="defEn" style="display:none">
    <div class="deflbl">In English</div>
    <div class="defbody" id="defEnBody"></div>
  </div>

</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var src=params.get('src');           // path to .epub
  var bookId=params.get('id')||src;    // key for saving position
  var fontSteps=[88,100,115,132,150,175,200,220];
  var fontIdx=parseInt(localStorage.getItem('rdr_font')||'1',10);
  var themes=['','sepia','light','black']; // '' = dark, black = OLED night
  var themeIdx=parseInt(localStorage.getItem('rdr_theme')||'0',10);
  var book,rendition;

  if(!src){document.getElementById('loading').textContent='No book specified.';return;}
  applyTheme();

  // ---- Cross-device reading position (Supabase, with localStorage fallback) ----
  // Non-sensitive, RLS-protected per user. Uses the same project as the store.
  var SB_URL="https://nzkgurdmvgkizvzisqxt.supabase.co";
  var SB_KEY="sb_publishable_XhncOLTTqr5qTs_G9O3Ecw_m6m5fU0f";
  var _sb=null, _uid=null, _saveTimer=null, _lastSaved=0;
  window.__saveProgress=function(id,cfi){
    // always keep local fast-path
    try{ localStorage.setItem('rdr_pos_'+id,cfi); }catch(e){}
    if(!_sb||!_uid) return;
    var now=Date.now(); if(now-_lastSaved<4000){ // throttle network writes
      clearTimeout(_saveTimer);
      _saveTimer=setTimeout(function(){ window.__saveProgress(id,cfi); },4000);
      return;
    }
    _lastSaved=now;
    try{
      _sb.from('reading_progress').upsert(
        {user_id:_uid,book_id:id,position:cfi,updated_at:new Date().toISOString()},
        {onConflict:'user_id,book_id'}
      ).then(function(){},function(){});
    }catch(e){}
  };

  // ====================================================================
  // ANNOTATIONS: highlights + bookmarks. Local-first (instant), cloud-
  // synced via Supabase 'annotations' table (own-row RLS, same pattern
  // as reading_progress). Records: {id,kind,cfi,text,created_at}.
  //   kind = 'highlight' | 'bookmark'
  // Local store key: rdr_ann_<bookId>.  Cloud upsert onConflict id.
  // ====================================================================
  var _curCfi=null;                       // updated on every 'relocated'
  var __wireRelocate=function(){};        // (re)attaches the relocated handler; set in _openWith

  // ====================================================================
  // READING TIME TRACKER -> reading_sessions (per-day minutes + books).
  // Accrues only ACTIVE time: counts while the reader tab is visible and
  // there has been interaction within the last 2 minutes. Flushes locally
  // every tick and to Supabase periodically. Streaks/goals derive from this.
  // ====================================================================
  var _rtSecs=0, _rtLastActive=Date.now(), _rtTick=null, _rtFlushAt=0;
  function _today(){ return new Date().toISOString().slice(0,10); }
  function _statKey(){ return 'rdr_stat_'+_today(); }
  function rtMarkActive(){ _rtLastActive=Date.now(); }
  function rtAccrueLocal(secs){
    try{
      var k=_statKey();
      var cur=JSON.parse(localStorage.getItem(k)||'{"m":0,"books":[]}');
      cur.m=(cur.m||0)+secs/60;
      if(cur.books.indexOf(bookId)<0) cur.books.push(bookId);
      localStorage.setItem(k, JSON.stringify(cur));
      // maintain a lightweight day-index so the stats screen can compute streaks offline
      var idx=JSON.parse(localStorage.getItem('rdr_stat_days')||'[]');
      if(idx.indexOf(_today())<0){ idx.push(_today()); localStorage.setItem('rdr_stat_days', JSON.stringify(idx)); }
    }catch(e){}
  }
  function rtFlushCloud(){
    if(!_sb||!_uid) return;
    try{
      var cur=JSON.parse(localStorage.getItem(_statKey())||'{"m":0,"books":[]}');
      _sb.from('reading_sessions').upsert(
        {user_id:_uid, day:_today(), minutes:Math.round(cur.m||0),
         books_read:cur.books||[], updated_at:new Date().toISOString()},
        {onConflict:'user_id,day'}
      ).then(function(){},function(){});
    }catch(e){}
  }
  function rtStart(){
    if(_rtTick) return;
    _rtTick=setInterval(function(){
      // only count if visible and active within the last 2 minutes
      if(document.hidden) return;
      if(Date.now()-_rtLastActive > 120000) return;
      _rtSecs+=5;
      rtAccrueLocal(5);
      if(Date.now()-_rtFlushAt > 30000){ _rtFlushAt=Date.now(); rtFlushCloud(); }
    }, 5000);
    ['click','keydown','touchstart','scroll','mousemove'].forEach(function(ev){
      document.addEventListener(ev, rtMarkActive, {passive:true});
    });
    document.addEventListener('visibilitychange',function(){ if(!document.hidden) rtMarkActive(); });
    window.addEventListener('pagehide', rtFlushCloud);
    window.addEventListener('beforeunload', rtFlushCloud);
  }
  function annKey(){ return 'rdr_ann_'+bookId; }
  function annLoad(){
    try{ return JSON.parse(localStorage.getItem(annKey())||'[]'); }catch(e){ return []; }
  }
  function annSaveLocal(list){
    try{ localStorage.setItem(annKey(), JSON.stringify(list)); }catch(e){}
  }
  function annId(){
    // RFC4122 v4 — the annotations.id column is uuid, so this MUST be a real UUID
    if(window.crypto&&crypto.randomUUID){ try{ return crypto.randomUUID(); }catch(e){} }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
      var r=Math.random()*16|0, v=c==='x'?r:(r&0x3|0x8); return v.toString(16);
    });
  }
  // Push a single annotation to the cloud (best-effort, never blocks UI).
  function annPushCloud(rec){
    if(!_sb||!_uid) return;
    try{
      _sb.from('annotations').upsert(
        {id:rec.id,user_id:_uid,book_id:bookId,kind:rec.kind,cfi:rec.cfi,
         text_excerpt:rec.text||'',color:rec.color||null,note:rec.note||'',
         created_at:rec.created_at||new Date().toISOString(),
         updated_at:new Date().toISOString()},
        {onConflict:'id'}
      ).then(function(){},function(){});
    }catch(e){}
  }
  function annDeleteCloud(id){
    if(!_sb||!_uid) return;
    try{ _sb.from('annotations').delete().eq('id',id).then(function(){},function(){}); }catch(e){}
  }
  // Pull cloud annotations once the session is ready; merge into local by id,
  // then repaint highlights and refresh any open notebook. Cloud is the
  // source of truth for cross-device; local-only rows are pushed up.
  window.__annSyncFromCloud=function(){
    if(!_sb||!_uid) return;
    try{
      _sb.from('annotations').select('id,kind,cfi,text_excerpt,color,note,created_at').eq('book_id',bookId)
        .then(function(r){
          var cloud=((r&&r.data)||[]).map(function(c){

  // Resolve the real, fetchable URL for this book.
  //  - Free books shipped in the app: the local books/<file> path works as-is.
  //  - Paid books: live in the private Supabase 'library' bucket; mint a signed
  //    URL (requires a logged-in session). Falls back to the local path so the
  //    14 bundled free books always work even offline / logged out.
  // Mint a signed library URL (paid books that aren't in the bundle).
  function signedLibraryUrl(){
    var key=src.replace(/^\.?\//,'');                 // "books/07-hell.epub"
    // Paid files are NOT readable straight from storage — the bucket has no
    // blanket read policy, deliberately (any signed-in user could otherwise
    // pull the whole catalogue). The library-url edge function verifies the
    // caller actually purchased this file's bundle, then signs it server-side.
    return getSb().then(function(sb){
      return sb.auth.getSession().then(function(s){
        var sess=s && s.data && s.data.session;

    var w=Math.max(0,Math.min(5,warmIdx));
    if(w>0 && op>0){ d.style.background='rgb('+(40+w*8)+','+(20+w*3)+',0)'; }
    else { d.style.background='#000'; }
  }
  window.setDim=function(dir){ dimIdx=Math.max(0,Math.min(dimSteps.length-1,dimIdx+dir)); localStorage.setItem('rdr_dim',dimIdx); applyDimmer(); };
  window.setWarm=function(dir){ warmIdx=Math.max(0,Math.min(5,warmIdx+dir)); localStorage.setItem('rdr_warm',warmIdx); applyDimmer(); };

  // ---- Reduce motion (manual toggle; also auto-on if the OS prefers it) ----
  var reduceMotion = localStorage.getItem('rdr_motion');
  if(reduceMotion===null){
    try{ reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? '1':'0'; }catch(e){ reduceMotion='0'; }
  }
  function applyMotion(){
    document.documentElement.style.scrollBehavior = reduceMotion==='1' ? 'auto':'';
    document.body.setAttribute('data-reduce-motion', reduceMotion==='1'?'1':'0');
    var mb=document.getElementById('motionBtn'); if(mb) mb.textContent = reduceMotion==='1'?'On':'Off';
    // tell the host (app shell / fun layer) so its celebrations honor the choice
    try{ parent.postMessage({type:'reduce-motion', on: reduceMotion==='1'}, '*'); }catch(e){}
  }
  window.toggleMotion=function(){ reduceMotion = reduceMotion==='1'?'0':'1'; localStorage.setItem('rdr_motion',reduceMotion); applyMotion(); };

  // ---- Table of contents ----
  window.toggleTOC=function(){
    var el=document.getElementById('toc');
    document.getElementById('settings').classList.remove('on');
    document.getElementById('search').classList.remove('on');
    document.getElementById('notebook').classList.remove('on');
    el.classList.toggle('on');
  };
  function buildTOC(){
    if(!book||!book.loaded||!book.loaded.navigation) return;
    book.loaded.navigation.then(function(nav){
      var list=document.getElementById('toclist'); if(!nav||!nav.toc){return;}
      var html='';
      nav.toc.forEach(function(ch){
        var label=(ch.label||'').trim().replace(/</g,'&lt;');
        html+='<a href="#" data-href="'+(ch.href||'').replace(/"/g,'&quot;')+'">'+label+'</a>';
      });
      list.innerHTML=html;
      Array.prototype.forEach.call(list.querySelectorAll('a'),function(a){
        a.addEventListener('click',function(ev){
          ev.preventDefault();
          var h=a.getAttribute('data-href'); if(h&&rendition) rendition.display(h);
          document.getElementById('toc').classList.remove('on');
        });
      });
    }).catch(function(){});
  }
  // buildTOC() is invoked after the book opens (see openTheBook), not at init,
  // because `book` does not exist until the async open resolves.

  // ---- In-book search (walks the spine via epub.js Section.find) ----
  var _searching=false;
  window.toggleSearch=function(){
    var el=document.getElementById('search');
    document.getElementById('toc').classList.remove('on');
    document.getElementById('settings').classList.remove('on');
    document.getElementById('notebook').classList.remove('on');
    var opening=!el.classList.contains('on');
    el.classList.toggle('on');
    if(opening){ setTimeout(function(){ var i=document.getElementById('searchInput'); if(i) i.focus(); }, 250); }
  };
  function highlight(excerpt, q){
    try{
      var i=excerpt.toLowerCase().indexOf(q.toLowerCase());
      if(i<0) return excerpt.replace(/</g,'&lt;');
      var pre=excerpt.slice(0,i).replace(/</g,'&lt;');
      var hit=excerpt.slice(i,i+q.length).replace(/</g,'&lt;');
      var post=excerpt.slice(i+q.length).replace(/</g,'&lt;');
      return pre+'<b>'+hit+'</b>'+post;
    }catch(e){ return excerpt.replace(/</g,'&lt;'); }
  }
  function chapLabelFor(href){
    var label='';
    try{ _tocFlat.forEach(function(it){ if(it.href && href.indexOf(it.href.split('#')[0])>=0) label=(it.label||'').trim(); }); }catch(e){}
    return label;
  }
  window.runSearch=function(){
    var q=(document.getElementById('searchInput').value||'').trim();
    var status=document.getElementById('searchStatus');
    var out=document.getElementById('searchResults');
    if(q.length<3){ status.textContent='Type at least 3 characters.'; out.innerHTML=''; return; }
    if(_searching){ return; }
    if(!book||!book.spine){ status.textContent='Book still loading\u2026'; return; }
    _searching=true; out.innerHTML=''; status.textContent='Searching\u2026';
    var results=[], items=[];
    book.spine.each(function(item){ items.push(item); });
    var idx=0, MAX=200;
    function step(){
      if(idx>=items.length || results.length>=MAX){ finish(); return; }
      var item=items[idx++];
      var p;
      try{ p=item.load(book.load.bind(book)); }catch(e){ p=Promise.reject(e); }
      Promise.resolve(p).then(function(){
        var found=[];
        try{ found=item.find(q)||[]; }catch(e){ found=[]; }
        found.forEach(function(r){
          if(results.length<MAX) results.push({cfi:r.cfi, excerpt:r.excerpt||'', href:item.href});
        });
        try{ item.unload(); }catch(e){}
        status.textContent='Searching\u2026 '+results.length+' found';
        // yield to the UI so the reader never freezes on a big book
        setTimeout(step, 0);
      }).catch(function(){ try{ item.unload(); }catch(e){} setTimeout(step, 0); });
    }
    function finish(){
      _searching=false;
      if(!results.length){ status.textContent='No matches for \u201c'+q.replace(/</g,'&lt;')+'\u201d.'; return; }
      status.textContent=results.length+(results.length===MAX?'+':'')+' match'+(results.length===1?'':'es');
      out.innerHTML=results.map(function(r){
        var lab=chapLabelFor(r.href||'');
        return '<a href="#" data-cfi="'+(r.cfi||'').replace(/"/g,'&quot;')+'">'+highlight(r.excerpt,q)+
               (lab?'<span class="rchap">'+lab.replace(/</g,'&lt;')+'</span>':'')+'</a>';
      }).join('');
      Array.prototype.forEach.call(out.querySelectorAll('a'),function(a){
        a.addEventListener('click',function(ev){
          ev.preventDefault();
          var cfi=a.getAttribute('data-cfi');
          if(cfi&&rendition){ rendition.display(cfi); }
          document.getElementById('search').classList.remove('on');
        });
      });
    }
    step();
  };
  // Enter key runs the search
  (function(){ var i=document.getElementById('searchInput'); if(i){ i.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); runSearch(); } }); } })();

  // ---- Settings sheet + immersive chrome toggle ----
  window.toggleSettings=function(){
    var el=document.getElementById('settings');
    document.getElementById('toc').classList.remove('on');
    document.getElementById('search').classList.remove('on');
    document.getElementById('notebook').classList.remove('on');
    el.classList.toggle('on');
  };
  // Scroll vs page mode. Changing epub.js flow requires re-creating the
  // rendition; we preserve the reader's exact spot via the current CFI.
  window.toggleFlow=function(){
    var cur=(localStorage.getItem('rdr_flow')==='scrolled')?'scrolled':'paged';
    var next=(cur==='scrolled')?'paged':'scrolled';
    localStorage.setItem('rdr_flow', next);
    _setFlowBtn();
    if(!book||!rendition) return;
    var at=_curCfi || localStorage.getItem('rdr_pos_'+bookId) || undefined;
    var flow=(next==='scrolled')?'scrolled-doc':'paginated';
    try{ rendition.destroy(); }catch(e){}
    try{
      rendition=book.renderTo('viewer',{width:'100%',height:'100%',spread:'none',flow:flow});
      try{ if(window.__bindRenderHooks) window.__bindRenderHooks(); }catch(e){}
      applyTheme();
      try{ applyFont(); }catch(e){}
      __wireRelocate();           // re-attach the relocated handler to the new rendition
      rendition.display(at);
    }catch(e){}
  };
  function _setFlowBtn(){
    var b=document.getElementById('flowBtn'); if(!b) return;
    var scrolled=(localStorage.getItem('rdr_flow')==='scrolled');
    b.textContent= scrolled ? 'Scroll' : 'Pages';
  }
  window.toggleChrome=function(){
    // close any open panels first; if a panel was open, just close it
    var toc=document.getElementById('toc'), set=document.getElementById('settings'), sch=document.getElementById('search'), nb=document.getElementById('notebook');
    if(toc.classList.contains('on')||set.classList.contains('on')||sch.classList.contains('on')||nb.classList.contains('on')){ toc.classList.remove('on'); set.classList.remove('on'); sch.classList.remove('on'); nb.classList.remove('on'); return; }
    document.body.classList.toggle('chrome-off');
  };

  // ---- Chapter label in footer (from current spine item's TOC entry) ----
  var _tocFlat=[];
  window.__initChapLabels=function(){
    if(!book||!book.loaded||!book.loaded.navigation) return;
    book.loaded.navigation.then(function(nav){
      function flatten(items){ (items||[]).forEach(function(it){ _tocFlat.push(it); if(it.subitems) flatten(it.subitems); }); }
      if(nav&&nav.toc) flatten(nav.toc);
    }).catch(function(){});
  };
  window.__setChapLabel=function(href){
    if(!href||!_tocFlat.length) return;
    var match=null;
    _tocFlat.forEach(function(it){ if(it.href && href.indexOf(it.href.split('#')[0])>=0) match=it; });
    if(match){ var el=document.getElementById('chap'); if(el) el.textContent=(match.label||'').trim(); }
  };
})();
</script>
</body></html>
